<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182e50"><title>RapoRon | スタンプ＆クイズラリー</title><link rel="icon" href="assets/favicon.ico"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/style.css?v=1.0.8"></head><body><main class="page welcome"><img src="assets/raporon-wordmark.png" class="hero-wordmark" alt="RapoRon"><p class="lead">歩いて、見つけて、楽しもう。<br>QRスタンプ＆クイズラリー</p><div class="panel"><h2>イベントに参加する</h2><p>参加用QRをカメラで読み取るか、印刷されたゲームIDを入力してください。</p>
<div class="join-buttons"><button type="button" id="scan-join" class="primary block">カメラで参加用QRを読み取る</button>
<div id="join-reader" class="reader join-reader hide" aria-label="参加用QR読み取り"></div>
<button type="button" id="stop-join" class="ghost block hide">カメラを停止</button></div>
<p id="join-status" class="message hide" role="status" aria-live="polite"></p>
<form id="join-form"><label>ゲームID（英小文字＋数字の4桁）<input id="game-id" autocomplete="off" placeholder="例：a7k2" autocapitalize="off" spellcheck="false" inputmode="text" required></label><button class="primary block" type="submit">参加する</button></form></div><a class="text-link" href="admin.html">運営者・管理画面へ</a><p class="copyright">© 2021–2026 Dobhar-chú</p></main><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id);
  let scanner=null,scanning=false,redirecting=false;
  const validId=id=>/^(?=.*[a-z])(?=.*[0-9])[a-z0-9]{4}$/.test(id) || /^[a-f0-9]{28}$/.test(id);
  function message(text,bad=false){const el=$('join-status');el.textContent=text;el.className='message '+(bad?'error':'ok');}
  const go=id=>{if(!validId(id))return message('ゲームIDは英小文字と数字を両方含む4桁で入力してください。',true);location.href='play.html?g='+encodeURIComponent(id);};
  $('join-form').addEventListener('submit',e=>{e.preventDefault();go($('game-id').value.trim().toLowerCase().replace(/[\s-]/g,''));});
  async function stop(){
    if(!scanner)return;
    const instance=scanner;scanner=null;
    try{if(scanning)await instance.stop();}catch(_e){}
    try{await instance.clear();}catch(_e){}
    scanning=false;$('join-reader').classList.add('hide');$('stop-join').classList.add('hide');
  }
  $('stop-join').addEventListener('click',stop);
  $('scan-join').addEventListener('click',async()=>{
    if(scanner||redirecting)return;
    if(!window.Html5Qrcode)return message('QR読み取り機能を読み込めません。ゲームIDを入力してください。',true);
    $('join-reader').classList.remove('hide');
    scanner=new Html5Qrcode('join-reader');
    try{
      await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},async raw=>{
        if(redirecting)return;
        let url;
        try{url=new URL(raw);}catch(_e){return message('参加用QRではありません。',true);}
        const id=url.searchParams.get('g');
        if(url.origin!==location.origin || url.pathname.split('/').pop()!=='play.html' || url.searchParams.has('s') || url.searchParams.has('t') || !validId(id||'')){
          return message('RapoRonの参加用QRを読み取ってください。',true);
        }
        redirecting=true;
        await stop();
        go(id);
      },()=>{});
      scanning=true;$('stop-join').classList.remove('hide');
      message('参加用QRをカメラにかざしてください。');
    }catch(e){await stop();message('カメラを起動できません。Safariのカメラ許可、HTTPS接続を確認するか、ゲームIDを入力してください。',true);}
  });
})();
</script></body></html>

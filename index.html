<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182e50"><title>RapoRon | スタンプ＆クイズラリー</title><link rel="icon" href="assets/favicon.ico"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/style.css"></head><body><main class="page welcome"><img src="assets/raporon-wordmark.png" class="hero-wordmark" alt="RapoRon"><p class="lead">歩いて、見つけて、楽しもう。<br>QRスタンプ＆クイズラリー</p><div class="panel"><h2>イベントに参加する</h2><p>会場の参加者用QRを読み取るとゲームが始まります。</p><form id="join-form"><label>ゲームID（QRを読み取れない場合）<input id="game-id" autocomplete="off" placeholder="ゲームIDを入力" required></label><button class="primary block" type="submit">参加する</button></form></div><a class="text-link" href="admin.html">運営者・管理画面へ</a><p class="copyright">© 2021–2026 Dobhar-chú</p></main><script>document.getElementById('join-form').addEventListener('submit',e=>{e.preventDefault();let id=document.getElementById('game-id').value.trim();if(/^[A-Za-z0-9_-]{8,40}$/.test(id))location.href='play.html?g='+encodeURIComponent(id);else alert('正しいゲームIDを入力してください')});</script></body></html>
